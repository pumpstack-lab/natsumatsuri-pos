<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>画面サイズ確認</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; padding: 20px; background:#f5f5f7; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.note { font-size:13px; color:#666; margin-bottom:16px; }
  table { width:100%; border-collapse: collapse; background:#fff; border-radius:12px; overflow:hidden; }
  td { padding: 12px 14px; border-bottom:1px solid #eee; font-size:16px; }
  td:first-child { color:#666; width:52%; }
  td:last-child { text-align:right; font-weight:700; font-size:20px; }
  .big { margin-top:16px; background:#1d1d1f; color:#fff; border-radius:12px; padding:16px; text-align:center; }
  .big span { font-size:13px; color:#98989d; display:block; }
  .big strong { font-size:34px; letter-spacing:-1px; }
</style>
</head>
<body>
<h1>画面サイズ確認</h1>
<p class="note">この数字をGetterに伝えてください（スクショでOK）</p>
<div class="big"><span>この画面で使える縦の高さ</span><strong id="h">-</strong></div>
<table>
  <tr><td>横 × 縦（表示領域）</td><td id="vp">-</td></tr>
  <tr><td>画面の実サイズ</td><td id="scr">-</td></tr>
  <tr><td>拡大率(DPR)</td><td id="dpr">-</td></tr>
  <tr><td>文字の基準サイズ</td><td id="fs">-</td></tr>
  <tr><td>safe-area 上 / 下</td><td id="sa">-</td></tr>
  <tr><td>起動のしかた</td><td id="sa2">-</td></tr>
</table>
<script>
  const $=(id)=>document.getElementById(id);
  const cs=getComputedStyle(document.documentElement);
  const px=(v)=>Math.round(parseFloat(v)||0);
  const probe=document.createElement('div');
  probe.style.cssText='position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden';
  document.body.appendChild(probe);
  const ps=getComputedStyle(probe);
  $('h').textContent=window.innerHeight+' px';
  $('vp').textContent=window.innerWidth+' × '+window.innerHeight;
  $('scr').textContent=screen.width+' × '+screen.height;
  $('dpr').textContent=window.devicePixelRatio;
  $('fs').textContent=getComputedStyle(document.body).fontSize;
  $('sa').textContent=px(ps.paddingTop)+' / '+px(ps.paddingBottom);
  $('sa2').textContent=window.navigator.standalone?'ホーム画面から':'Safariのタブ';
</script>
</body>
</html>
